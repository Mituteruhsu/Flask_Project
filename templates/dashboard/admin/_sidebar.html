{# templates/dashboard/admin/_sidebar.html #}
<div class="col-md-3 col-lg-2 mb-3">

    <!-- 業務管理：日常真正會用到的 CRUD 入口 -->
    <div class="card shadow-sm mb-3">
        <div class="card-header bg-secondary text-white fw-bold">
            📋 業務管理
        </div>
        <div class="list-group list-group-flush">
            <a href="{{ url_for('admin.admin_users') }}"
            class="list-group-item list-group-item-action {% if request.endpoint == 'admin.admin_users' %}active fw-bold{% endif %}">
            👤 使用者管理
            </a>
            <a href="{{ url_for('admin.admin_families') }}"
            class="list-group-item list-group-item-action {% if request.endpoint == 'admin.admin_families' %}active fw-bold{% endif %}">
            🏠 家庭管理
            </a>
        </div>
    </div>

  <!-- DB 除錯檢視：原本的全表格瀏覽器，降級為進階功能 -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center"
            role="button" data-bs-toggle="collapse" data-bs-target="#dbTableCollapse">
        <span>🗄️ DB 全表檢視</span>
        <i class="bi bi-chevron-down small"></i>
        </div>
        <div class="collapse {% if request.endpoint == 'admin.admin_index' %}show{% endif %}" id="dbTableCollapse">
        <div class="list-group list-group-flush" style="max-height: 55vh; overflow-y: auto;">
            {% for name in table_names %}
            <a href="{{ url_for('admin.admin_index', table=name) }}"
                class="list-group-item list-group-item-action small {% if name == selected_table and request.endpoint == 'admin.admin_index' %}active fw-bold{% endif %}">
                <i class="bi bi-table me-2"></i>{{ name }}
            </a>
            {% endfor %}
        </div>
        </div>
    </div>

</div>
